name: 功能建议
description: 提议新的工作流或交互改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述当前工作流中的具体困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望交互、快捷键或界面行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明试过的其他方法或可接受的折中。
  - type: checkboxes
    id: compatibility
    attributes:
      label: 兼容性检查
      options:
        - label: 该建议不会以 Photoshop 取色后第一笔失效、任务栏闪烁或要求用户多画一笔作为折中
    validations:
      required: true
