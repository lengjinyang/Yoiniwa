name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality checks
        run: npm run check

  rust:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Add MSVC target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Compile check
        run: npm run check:rust
      - name: Unit tests
        run: npm run test:rust
      # Advisory for now: the crate carries ~40 clippy warnings, most of them
      # unused video_service/video_proxy entry points that still need a
      # keep-or-drop decision. Once those are resolved, ratchet this to
      # `npm run lint:rust -- -- -D warnings` so it gates like the TS lint.
      - name: Clippy (advisory)
        run: npm run lint:rust
        continue-on-error: true
