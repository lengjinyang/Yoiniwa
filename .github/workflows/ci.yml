name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality checks
        run: npm run check

  rust:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Add MSVC target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Compile check
        run: npm run check:rust
      - name: Unit tests
        run: npm run test:rust
      - name: Clippy warnings gate
        # native.rs is frozen for collaboration / Windows Ink. The two allows cover
        # lints that currently only fire there; do not "clean" that module for CI.
        run: npm run lint:rust -- -- -D warnings -A clippy::let_unit_value -A clippy::unnecessary_cast
