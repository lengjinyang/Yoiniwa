name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build signed updater release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: Yoiniwa v__VERSION__
          releaseBody: |
            Yoiniwa 0.2.2 Windows x64 稳定性更新。

            - 修复打开无效工程后原画板无法保存，以及另存为当前工程被自身文件锁拒绝的问题。
            - 修复并发导入图片的图层顺序和点击选择不一致，并为损坏图片导入显示失败原因。
            - 统一画布缩放范围，避免连续缩放后图片消失及极端倍率下空间索引阻塞。
            - 修复调整、删除和切换选择交错时的撤销历史污染，并合并同一 Windows 工程的重复最近记录。

            下载下方 x64-setup.exe 安装；已有版本也可通过应用内更新升级。
          releaseDraft: true
          uploadUpdaterJson: true
          args: --target x86_64-pc-windows-msvc --bundles nsis
