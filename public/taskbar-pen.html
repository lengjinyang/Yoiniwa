<!doctype html>
<meta charset="utf-8">
<style>
  html, body, #surface { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; touch-action: none; user-select: none; }
</style>
<div id="surface"></div>
<script>
  const surface = document.getElementById('surface');
  let active, mode, lastX, lastY, pendingMove, pendingEnd, ending = false, gesture = 0, ignoredLostCapture;
  let sending = false;
  const pointerQueue = [];
  const invoke = (command, payload) => window.__TAURI_INTERNALS__.invoke(command, payload);
  const payload = (kind, event) => ({
    input: { kind, pointerId: event.pointerId, pointerType: event.pointerType, button: event.button,
      buttons: event.buttons, clientX: event.clientX, clientY: event.clientY, altKey: event.altKey, mode },
  });
  // Preserve contact order across async Tauri commands and collapse stale move samples.
  const send = (next) => {
    const tail = pointerQueue[pointerQueue.length - 1];
    if (next.input.kind === 'move' && tail?.input.kind === 'move') pointerQueue[pointerQueue.length - 1] = next;
    else pointerQueue.push(next);
    if (sending) return;
    sending = true;
    void (async () => {
      while (pointerQueue.length) {
        try { await invoke('taskbar_pen_pointer', pointerQueue.shift()); } catch {}
      }
      sending = false;
    })();
  };
  const clear = () => {
    active = undefined; mode = undefined; pendingMove = undefined; pendingEnd = undefined;
    ending = false; ignoredLostCapture = undefined;
  };
  const finishPending = () => {
    if (!mode) return;
    if (pendingMove && mode !== 'block') send({ input: { ...pendingMove.input, mode } });
    pendingMove = undefined;
    if (pendingEnd) {
      if (mode !== 'block') send({ input: { ...pendingEnd.input, mode } });
      clear();
    }
  };
  const move = (event) => {
    if (event.pointerId !== active || ending) return;
    event.preventDefault();
    if (event.clientX === lastX && event.clientY === lastY) return;
    lastX = event.clientX; lastY = event.clientY;
    const next = payload('move', event);
    if (mode) { if (mode !== 'block') send({ input: { ...next.input, mode } }); } else pendingMove = next;
  };
  surface.addEventListener('pointerdown', (event) => {
    const primary = event.button === 0 || (event.button === -1 && (event.buttons & 1) !== 0);
    if (event.pointerType !== 'pen' || event.isPrimary === false || !primary) return;
    const currentGesture = ++gesture;
    active = event.pointerId; mode = undefined; pendingMove = undefined; pendingEnd = undefined; ending = false;
    lastX = event.clientX; lastY = event.clientY; event.preventDefault();
    // Pen contacts can receive implicit Pointer Capture. Release it immediately:
    // retaining capture in this no-activate WebView until pen-up forces a native
    // target handoff before Photoshop's next contact, which is especially visible
    // across monitors. Picking only needs events while the tip remains in Yoiniwa.
    try {
      if (surface.hasPointerCapture(active)) {
        ignoredLostCapture = active;
        surface.releasePointerCapture(active);
      }
    } catch {}
    const start = payload('down', event);
    invoke('taskbar_pen_start', start).then((nextMode) => {
      if (currentGesture !== gesture || start.input.pointerId !== active) return;
      mode = nextMode === 'pick' || nextMode === 'pan' ? nextMode : 'block';
      if (mode !== 'block') send({ input: { ...start.input, mode } });
      finishPending();
    }).catch(() => {
      if (currentGesture === gesture) clear();
    });
  }, { passive: false });
  surface.addEventListener('pointermove', move, { passive: false });
  surface.addEventListener('pointerrawupdate', move, { passive: false });
  surface.addEventListener('pointerup', (event) => {
    if (event.pointerId !== active) return;
    event.preventDefault(); move(event);
    const end = payload('up', event);
    ending = true;
    if (mode) { if (mode !== 'block') send({ input: { ...end.input, mode } }); clear(); }
    else pendingEnd = end;
  }, { passive: false });
  const cancel = (event) => {
    if (event.pointerId !== active || ending) return;
    event.preventDefault(); const end = payload('cancel', event);
    ending = true;
    if (mode) { if (mode !== 'block') send({ input: { ...end.input, mode } }); clear(); }
    else pendingEnd = end;
  };
  surface.addEventListener('pointercancel', cancel, { passive: false });
  surface.addEventListener('lostpointercapture', (event) => {
    if (event.pointerId === ignoredLostCapture) { ignoredLostCapture = undefined; return; }
    cancel(event);
  });
  surface.addEventListener('pointerleave', (event) => {
    if (event.pointerId === active && (event.buttons & 1) !== 0) cancel(event);
  });
  addEventListener('contextmenu', (event) => event.preventDefault());
</script>
