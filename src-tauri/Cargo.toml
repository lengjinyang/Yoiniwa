[package]
name = "yoiniwa"
version = "0.1.0"
description = "Yoiniwa quiet offline reference board"
authors = ["Yoiniwa"]
edition = "2021"

[lib]
name = "yoiniwa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
anyhow = "1.0"
arboard = "3.6"
base64 = "0.22"
brotli = "8.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
crc32fast = "1.5"
dirs = "6.0"
drag = "2.1"
mime_guess = "2.0"
parking_lot = "0.12"
percent-encoding = "2.3"
png = "0.18"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.8", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2.3"
thiserror = "2.0"
tokio = { version = "1.48", features = ["sync", "rt", "time"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
wait-timeout = "0.2"
zip = { version = "6.0", default-features = false, features = ["deflate", "zstd"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
  "Win32_Media_Audio", "Win32_System_Com", "Win32_System_DataExchange",
  "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole",
  "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility",
  "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
